
{% extends "base.html" %}

{% block title %}Rate {{ movie.title }} | CineStats{% endblock %}

{% block content %}
<section class="rating-page">
    <a class="back-link"
       href="{{ url_for('movie_detail', movie_id=movie.movie_id) }}">
        ← Back to movie details
    </a>

    <div class="rating-form-card">
        <span class="eyebrow">YOUR OPINION MATTERS</span>
        <h1>Rate this movie</h1>
        <h2>{{ movie.title }}</h2>

        <p class="muted">
            How would you rate this movie? Select a score from 0.5 to 5 stars.
        </p>

        <form method="POST"
              action="{{ url_for('rate_movie', movie_id=movie.movie_id) }}"
              class="form">

            <label for="rating">Your rating</label>

            <select id="rating" name="rating" required>
                <option value="">-- Select your rating --</option>
                <option value="0.5">0.5 / 5</option>
                <option value="1.0">1.0 / 5</option>
                <option value="1.5">1.5 / 5</option>
                <option value="2.0">2.0 / 5</option>
                <option value="2.5">2.5 / 5</option>
                <option value="3.0">3.0 / 5</option>
                <option value="3.5">3.5 / 5</option>
                <option value="4.0">4.0 / 5</option>
                <option value="4.5">4.5 / 5</option>
                <option value="5.0">5.0 / 5</option>
            </select>

            <button type="submit" class="btn">
                Submit Rating
            </button>
        </form>
    </div>
</section>
{% endblock %}
